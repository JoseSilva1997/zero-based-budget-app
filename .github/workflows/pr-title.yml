name: PR title

# Checks on a release PR, the only kind of pull request main takes. Pull
# requests into staging need neither: they are never released on their own.
#
# Release source: releases go staging -> main, so a PR into main from any other
# branch fails. Without it, a feature branch opened against main out of habit
# would be released without ever reaching staging or a staging build.
#
# Version prefix: the merged PR's title is what release.yml reads to pick the
# version bump, so a PR without a bump prefix cannot merge.
#
# GitHub has no hook to stop a PR being opened; a required check that fails is
# the closest thing, and it blocks the merge button until it is fixed. Kept
# apart from ci.yml so that retitling or retargeting a PR re-runs this in
# seconds instead of re-running every suite. `edited` fires on a title,
# description or base branch change.

on:
  pull_request:
    branches: [ "main" ]
    types: [ opened, edited, reopened, synchronize ]

permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source:
    name: Release source
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the PR comes from staging
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [[ $HEAD_REF == staging && $HEAD_REPO == "$REPO" ]]; then
            echo "Release PR from staging."
            exit 0
          fi

          echo "::error title=Releases go staging -> main::This PR is from $HEAD_REPO:$HEAD_REF. Only staging merges into main. Retarget this PR to staging (Edit, next to the title), then release with a PR from staging into main."
          exit 1

  title:
    name: Version prefix
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the title starts with maj, med or min
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Same pattern as release.yml; change both together.
          prefix='^[[:space:]]*(maj|med|min)[[:space:]]*(\([^)]*\))?[[:space:]]*:'
          shopt -s nocasematch
          if [[ $TITLE =~ $prefix ]]; then
            echo "Title picks a ${BASH_REMATCH[1],,} release."
            exit 0
          fi

          echo "::error title=PR title needs a version prefix::Start the title with maj:, med: or min: (a scope is fine, e.g. \"med (ui): ...\"). maj = 1.4.2 -> 2.0.0, med = 1.4.2 -> 1.5.0, min = 1.4.2 -> 1.4.3."
          exit 1
