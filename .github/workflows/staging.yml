name: Staging build

# Every push to staging builds the Windows installer and the Linux AppImage and
# keeps them as workflow artifacts for 14 days, to install and try before the
# release PR into main. Nothing here is a GitHub release, so electron-updater
# never sees these builds and no installed copy is offered one.
#
# A staging build is a separate app, so it can sit beside the real one on the
# same machine without touching its data:
#   * productName "House Budget Staging" gives it its own userData folder
#     (database, backups, cloud backup settings) and its own shortcuts;
#   * appId com.housebudget.staging gives it its own NSIS install and
#     uninstall entry, so installing it never replaces the real app;
#   * the version is the next patch after the latest tag plus this run's
#     number, e.g. 1.2.1-staging.42, shown under Help -> Version. main/updater.ts
#     turns the updater off for any -staging. version, since semver ranks it
#     below the release it leads up to and would "update" to the live one.
# All three are stamped into package.json on the runner only, like release.yml
# does with the version.
#
# Run it by hand from any branch to get an installer for a branch that has not
# reached staging yet.

on:
  push:
    branches: [ "staging" ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist-args: ''
            cache: |
              ~\AppData\Local\electron\Cache
              ~\AppData\Local\electron-builder\Cache
            artifact: house-budget-staging-windows
            files: |
              release/*.exe
          - os: ubuntu-latest
            dist-args: --linux
            cache: |
              ~/.cache/electron
              ~/.cache/electron-builder
            artifact: house-budget-staging-linux
            files: |
              release/*.AppImage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      # Full history, which brings every tag with it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Cache Electron binaries
        uses: actions/cache@v6
        with:
          path: ${{ matrix.cache }}
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Stamp the staging identity into package.json
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          latest=$(git tag --list 'v*.*.*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          IFS=. read -r major minor patch <<< "${latest:-v0.0.0}"
          version="${major#v}.$minor.$((patch + 1))-staging.$RUN_NUMBER"
          echo "${latest:-no previous tag} -> $version"
          echo "### Staging build $version" >> "$GITHUB_STEP_SUMMARY"

          VERSION=$version node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = process.env.VERSION;
            pkg.productName = "House Budget Staging";
            pkg.build.productName = "House Budget Staging";
            pkg.build.appId = "com.housebudget.staging";
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '

      - name: Compile main process
        run: npm run build

      - name: Build renderer
        run: npm run build:renderer

      - name: Package
        run: npm run dist -- ${{ matrix.dist-args }} --publish never

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          retention-days: 14
          if-no-files-found: error
