name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v1.0.0)'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify tag matches package.json
        run: npm run check:version -- ${{ inputs.tag || github.ref_name }}

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Compile main process
        run: npm run build

      - name: Build renderer
        run: npm run build:renderer

      - name: Run tests
        run: npm test

      - name: Ensure a single draft release exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Draft already exists for $TAG"
          else
            gh release create "$TAG" --draft --title "$TAG" --generate-notes
          fi

      - name: Package installer
        run: npm run dist -- --publish never

      - name: Upload assets to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # nullglob: an unmatched pattern expands to nothing rather than being
          # passed through literally, which would fail the upload on a file
          # that was never generated (the blockmap is not always emitted).
          shopt -s nullglob
          gh release upload "$TAG" release/*.exe release/*.blockmap release/latest.yml --clobber

      - name: Upload installer as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: house-budget-installer
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: warn